<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="隨時取得最新 AI 科技新聞：產業動態、研究知識、官方公告、中文媒體">
  <title>AI 新聞雷達</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <h1>AI 新聞雷達</h1>
    </div>
    <div class="actions">
      <button id="refreshBtn" class="icon-btn" type="button" title="重新抓取最新新聞" aria-label="重新整理">⟳</button>
      <button id="statusBtn" class="icon-btn" type="button" title="來源狀態" aria-label="來源狀態">ⓘ</button>
    </div>
  </header>

  <div class="controls">
    <input id="search" type="search" placeholder="搜尋關鍵字，例如：GPT、Nvidia、agent" autocomplete="off">
    <nav id="tabs" class="tabs" aria-label="分類">
      <button type="button" data-cat="" class="active">全部</button>
      <button type="button" data-cat="industry">產業動態</button>
      <button type="button" data-cat="research">研究與知識</button>
      <button type="button" data-cat="official">官方公告</button>
      <button type="button" data-cat="zh">中文媒體</button>
      <button type="button" data-cat="saved">★ 收藏</button>
    </nav>
  </div>

  <main>
    <p id="meta" class="meta"></p>
    <ul id="list" class="list" aria-live="polite"></ul>
    <p id="empty" class="empty" hidden></p>
  </main>

  <dialog id="statusDialog">
    <h2>來源狀態</h2>
    <ul id="statusList" class="status-list"></ul>
    <form method="dialog"><button type="submit">關閉</button></form>
  </dialog>

  <template id="cardTpl">
    <li class="card">
      <div class="card-head">
        <span class="badge"></span>
        <span class="source"></span>
        <time class="time"></time>
      </div>
      <a class="title" target="_blank" rel="noopener noreferrer"></a>
      <p class="summary"></p>
      <div class="card-actions">
        <button type="button" class="save-btn">☆ 收藏</button>
        <button type="button" class="share-btn">分享</button>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
